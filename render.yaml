services:
  - type: web
    name: smartmovie
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMDB_REGION
        value: MY
      - key: TMDB_SYNC_PAGES
        value: "5"
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: TMDB_API_KEY
        sync: false
