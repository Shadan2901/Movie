<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Smart Movies</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">
  <header class="navbar auth-navbar">
    <div class="nav-brand">
      <div class="logo">SM</div>
      <span class="brand-text">Smart Movies</span>
    </div>
  </header>

  <main class="auth-shell">
    <section class="auth-visual">
      <span class="search-eyebrow">Welcome Back</span>
      <h1>Sign in to continue your movie night.</h1>
      <p>Keep your profile, wishlist, and recommendations ready whenever you return.</p>

      <div class="auth-poster-stack" aria-label="Featured movie posters">
        <a class="auth-poster main" href="https://www.youtube.com/results?search_query=Spider-Man%20Brand%20New%20Day%202026%20official%20trailer" data-trailer-id="969681" data-trailer-title="Spider-Man: Brand New Day" data-trailer-year="2026" aria-label="Play Spider-Man: Brand New Day trailer">
          <img src="images/Spiderman.webp" alt="Spider-Man: Brand New Day poster" />
        </a>
        <a class="auth-poster side top" href="https://www.youtube.com/results?search_query=Avengers%20Doomsday%202026%20official%20trailer" data-trailer-id="1003596" data-trailer-title="Avengers: Doomsday" data-trailer-year="2026" aria-label="Play Avengers: Doomsday trailer">
          <img src="images/Doomsday.jpg" alt="Avengers: Doomsday poster" />
        </a>
        <a class="auth-poster side bottom" href="https://www.youtube.com/results?search_query=Avengers%20Endgame%202019%20official%20trailer" data-trailer-id="299534" data-trailer-title="Avengers: Endgame" data-trailer-year="2019" aria-label="Play Avengers: Endgame trailer">
          <img src="images/Avengers.webp" alt="Avengers: Endgame poster" />
        </a>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-card-head">
        <h2>Login</h2>
        <p>Use your registered email and password.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <label>
          Email
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </label>

        <label>
          Password
          <input type="password" id="loginPassword" placeholder="Enter password" required />
        </label>

        <div class="auth-options">
          <label class="auth-check">
            <input type="checkbox" id="rememberInput" checked />
            Remember me
          </label>
          <a href="register.html">Create account</a>
        </div>

        <button class="auth-submit" type="submit">Sign In</button>
        <p class="auth-message" id="authMessage"></p>
      </form>
    </section>
  </main>

  <script src="trailer.js?v=5"></script>
  <script src="auth.js"></script>
</body>
</html>
